name: pathsaathi_ai
description: "PathSaathi AI - Every Learner Deserves a Guide. An offline-first multilingual AI learning ecosystem for underserved learners in India."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  lottie: ^3.1.3
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  fl_chart: ^0.69.0
  flutter_svg: ^2.0.10+1
  smooth_page_indicator: ^1.2.0+3
  percent_indicator: ^4.2.4
  confetti: ^0.8.0
  animated_text_kit: ^4.2.3
  flutter_markdown: ^0.7.7

  # Navigation & State
  go_router: ^14.6.2
  provider: ^6.1.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.3
  google_sign_in: ^6.2.1

  # AI & APIs
  http: ^1.2.2
  dio: ^5.7.0

  # Media & Input
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  permission_handler: ^11.3.1

  # Speech
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  # Offline Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3
  path_provider: ^2.1.4

  # Utilities
  connectivity_plus: ^6.1.1
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  file_picker: ^8.1.7
  open_file: ^3.3.2
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/data/
